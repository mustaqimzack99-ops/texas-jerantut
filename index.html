<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F6">
<title>Texas Jerantut</title>
<!-- Web app (iPhone: Safari > Share > Add to Home Screen) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Texas Jerantut">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    color-scheme: dark;
    --bg: #0A0B0E;
    --card: #14161C;
    --card-hi: #1B1E26;
    --field: #0F1116;
    --stroke: rgba(255,255,255,.06);
    --stroke-2: rgba(255,255,255,.11);
    --text: #F5F6F8;
    --text-2: #C4C8D0;
    --muted: #8B909B;
    --faint: #5D626C;
    --red: #E5232E;
    --red-hi: #FF4D57;
    --red-lo: #8F0E17;
    --red-soft: rgba(229,35,46,.14);
    --green: #2ED47A;
    --green-soft: rgba(46,212,122,.14);
    --amber: #FFB020;
    --amber-soft: rgba(255,176,32,.14);
    --violet: #9A8BFF;
    --violet-soft: rgba(154,139,255,.15);
    --minus: #FF7A80;
    --r-xl: 24px;
    --r-l: 20px;
    --r: 14px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --ov: rgba(255,255,255,.06);
    --ov-2: rgba(255,255,255,.09);
    --ov-3: rgba(255,255,255,.16);
    --tile: #1B1E26;
    --sheet: #1B1E26;
    --seg-on: #1B1E26;
    --nav-bg: rgba(22,24,30,.82);
    --nav-on: #FFFFFF;
    --sheen: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.008));
    --shadow-card: 0 14px 34px rgba(0,0,0,.35);
    --shadow-nav: 0 16px 40px rgba(0,0,0,.55);
    --shadow-tile: none;
    --gate-glow-1: rgba(255,77,87,.45);
    --gate-glow-2: rgba(143,14,23,.6);
    --glow-1: rgba(229,35,46,.24);
    --glow-2: rgba(143,14,23,.30);
  }
  /* Tema cerah */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F3F6;
    --card: #FFFFFF;
    --card-hi: #FFFFFF;
    --field: #F1F2F5;
    --stroke: rgba(16,18,24,.07);
    --stroke-2: rgba(16,18,24,.12);
    --text: #14161B;
    --text-2: #3E434C;
    --muted: #6B717C;
    --faint: #9A9FA8;
    --red-soft: rgba(229,35,46,.10);
    --green: #12A15A;
    --green-soft: rgba(18,161,90,.12);
    --amber: #C27400;
    --amber-soft: rgba(255,170,30,.16);
    --violet: #6B57F0;
    --violet-soft: rgba(107,87,240,.12);
    --minus: #D3242E;
    --ov: rgba(16,18,24,.05);
    --ov-2: rgba(16,18,24,.08);
    --ov-3: rgba(16,18,24,.16);
    --tile: #F2F3F6;
    --sheet: #FFFFFF;
    --seg-on: #FFFFFF;
    --nav-bg: rgba(255,255,255,.88);
    --nav-on: var(--red);
    --sheen: none;
    --shadow-card: 0 1px 2px rgba(16,18,24,.05), 0 8px 24px rgba(16,18,24,.07);
    --shadow-nav: 0 10px 30px rgba(16,18,24,.14);
    --shadow-tile: 0 1px 2px rgba(16,18,24,.05), 0 4px 14px rgba(16,18,24,.05);
    --gate-glow-1: rgba(229,35,46,.22);
    --gate-glow-2: rgba(229,35,46,.10);
    --glow-1: rgba(229,35,46,.10);
    --glow-2: rgba(229,35,46,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(130% 55% at 85% -12%, var(--glow-1), transparent 60%),
      radial-gradient(90% 40% at 0% -5%, var(--glow-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.4 Roboto, "Segoe UI", system-ui, sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  input { user-select: text; -webkit-user-select: text; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Header ---------- */
  .appbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
  .mark {
    width: 40px; height: 40px; border-radius: 12px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(145deg, var(--red-hi), var(--red) 45%, var(--red-lo));
    box-shadow: 0 6px 18px rgba(229,35,46,.45), inset 0 1px 0 rgba(255,255,255,.35);
    display: grid; place-items: center; font-weight: 900; font-size: 15px; letter-spacing: -.5px; color: #fff;
  }
  .mark::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 45%); }
  .brand { flex: 1 0 auto; min-width: 0; }
  .brand b { display: block; font-size: 17px; font-weight: 800; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; height: 36px; padding: 0 12px;
    background: var(--ov); border: 1px solid var(--stroke-2); border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--text-2);
  }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip svg.i { width: 15px; height: 15px; color: var(--muted); }
  @media (max-width: 380px) { .chip svg.i:first-child { display: none; } .brand b { font-size: 16px; } .chip { padding: 0 10px; } }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 112px; }
  .view { display: none; }
  .view.on { display: block; }
  .view.on > * { animation: rise .5s var(--ease) both; }
  .view.on > *:nth-child(2) { animation-delay: .05s; }
  .view.on > *:nth-child(3) { animation-delay: .1s; }
  .view.on > *:nth-child(4) { animation-delay: .15s; }
  .view.on > *:nth-child(5) { animation-delay: .2s; }
  .view.on > *:nth-child(n+6) { animation-delay: .25s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .card {
    position: relative; border-radius: var(--r-l); padding: 18px; margin-bottom: 14px;
    background: var(--sheen), var(--card);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow-card);
  }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* ---------- Banner tempoh lama ---------- */
  .past {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--amber-soft); border: 1px solid rgba(255,176,32,.25); color: var(--amber);
    border-radius: var(--r); padding: 11px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 600;
  }
  .past span { flex: 1; }
  .past b { white-space: nowrap; }

  /* ---------- Hero gaji ---------- */
  .hero {
    overflow: hidden; padding: 20px 20px 18px; color: #fff; border: 1px solid rgba(255,90,100,.18);
    background:
      var(--hero-art, none) center / cover no-repeat,
      radial-gradient(85% 110% at 105% -5%, rgba(255,77,87,.62), transparent 55%),
      radial-gradient(75% 95% at -10% 115%, rgba(120,8,16,.95), transparent 60%),
      linear-gradient(150deg, #3D0B12 0%, #1B0B0F 55%, #121318 100%);
    box-shadow: 0 22px 50px rgba(120,10,18,.35), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero::before { /* cincin hiasan */
    content: ""; position: absolute; width: 300px; height: 300px; right: -120px; top: -130px; border-radius: 50%;
    background: repeating-radial-gradient(circle, rgba(255,255,255,.07) 0 1px, transparent 1px 22px);
    -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%);
    pointer-events: none;
  }
  .hero::after { /* kilauan */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.06) 45%, transparent 60%);
  }
  .hero > * { position: relative; z-index: 1; }
  .hero .eyebrow { color: rgba(255,255,255,.62); }
  .pp { font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.8); background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12); padding: 4px 10px; border-radius: 999px; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { display: flex; align-items: baseline; margin: 10px 0 4px; line-height: 1; }
  .amt .cur { font-size: 18px; font-weight: 700; color: rgba(255,255,255,.7); margin-right: 6px; }
  .amt .int { font-size: 46px; font-weight: 800; letter-spacing: -1.5px; }
  .amt .dec { font-size: 24px; font-weight: 700; color: rgba(255,255,255,.75); letter-spacing: -.5px; }
  .amt2 { margin-top: 8px; }
  .amt2 .int { font-size: 32px; letter-spacing: -1px; }
  .amt2 .dec { font-size: 19px; }
  .amt2 .cur { font-size: 15px; }
  .hero-div { height: 1px; margin: 16px 0 14px; background: linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); }
  .hero .eyebrow .tag { margin: 0 0 0 6px; vertical-align: 1px; background: rgba(46,212,122,.2); color: #5EF0A0; }
  .amt-sub { display: flex; gap: 16px; font-size: 12.5px; color: rgba(255,255,255,.66); }
  .amt-sub b { color: #fff; font-weight: 700; }
  .split { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin: 16px 0 10px; background: rgba(255,255,255,.08); }
  .split i { display: block; height: 100%; transition: width .8s var(--ease); }
  .split i + i { margin-left: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: rgba(255,255,255,.66); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend span::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }

  /* ---------- Stat ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { border-radius: 18px; padding: 14px; background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--shadow-tile); display: flex; align-items: center; gap: 12px; }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--c); }
  .stat b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.3px; line-height: 1.1; }
  .stat span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- Jam punch ---------- */
  .clock { display: flex; align-items: center; gap: 16px; margin: 14px 0 16px; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .trk { fill: none; stroke: var(--ov-2); stroke-width: 9; }
  .ring .prg { fill: none; stroke: url(#gWork); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); filter: drop-shadow(0 0 6px rgba(229,35,46,.55)); }
  .ring.brk .prg { stroke: url(#gBrk); filter: drop-shadow(0 0 6px rgba(255,176,32,.5)); }
  .ring.over .prg { stroke: var(--red-hi); filter: drop-shadow(0 0 6px rgba(229,35,46,.6)); }
  .ring.over .ring-c b { color: var(--minus); }
  .ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-c b { font-size: 28px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
  .ring-c b small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .ring-c span { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .clock-info { flex: 1; min-width: 0; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 999px; background: var(--ov); color: var(--text-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status.work { background: var(--green-soft); color: var(--green); }
  .status.work .dot { background: var(--green); animation: pulse 1.6s infinite; }
  .status.brk { background: var(--amber-soft); color: var(--amber); }
  .status.brk .dot { background: var(--amber); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .clock-date { font-size: 17px; font-weight: 700; margin-top: 10px; }
  .clock-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .tl { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; position: relative; }
  .tl::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 25px; height: 2px; background: var(--ov-2); }
  .tl-s { text-align: center; position: relative; }
  .tl-s em { display: block; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); margin-bottom: 7px; }
  .tl-s i { display: block; width: 12px; height: 12px; margin: 0 auto; border-radius: 50%; background: var(--card); border: 2px solid var(--ov-3); position: relative; z-index: 1; }
  .tl-s b { display: block; font-size: 12.5px; font-weight: 700; margin-top: 7px; color: var(--faint); }
  .tl-s.done em { color: var(--muted); }
  .tl-s.done i { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
  .tl-s.done b { color: var(--text); }

  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; min-height: 52px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(180deg, var(--red-hi), var(--red) 55%, #C81822); color: #fff;
    font-weight: 800; font-size: 14.5px; letter-spacing: .6px; padding: 0 16px;
    box-shadow: 0 10px 24px rgba(229,35,46,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s, filter .12s;
  }
  .btn:active { transform: scale(.97); filter: brightness(.92); }
  .btn-row .btn:not(:only-child) { font-size: 13.5px; letter-spacing: .2px; padding: 0 10px; gap: 7px; white-space: nowrap; }
  .btn.big { min-height: 58px; font-size: 15.5px; }
  .btn.go { background: linear-gradient(180deg, #45E08D, var(--green) 55%, #1FB565); color: #062312; box-shadow: 0 10px 24px rgba(46,212,122,.28), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.amber { background: var(--amber-soft); color: var(--amber); box-shadow: inset 0 0 0 1px rgba(255,176,32,.35); }
  .btn.ghost { background: var(--ov); color: var(--text); box-shadow: inset 0 0 0 1px var(--stroke-2); font-weight: 700; letter-spacing: .2px; }
  .btn.danger { background: var(--red-soft); color: var(--minus); box-shadow: inset 0 0 0 1px rgba(229,35,46,.3); font-weight: 700; letter-spacing: .2px; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- Slip ---------- */
  .slip { margin-top: 6px; }
  .li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--stroke); }
  .li:last-child { border-bottom: 0; }
  .li div b { display: block; font-weight: 600; font-size: 14.5px; }
  .li div span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .li > span { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .li.minus > span { color: var(--minus); }
  .li.sum { border-bottom-color: var(--stroke-2); }
  .li.sum div b { font-weight: 800; letter-spacing: .6px; font-size: 13px; color: var(--text-2); }
  .li.sum > span { font-size: 16px; font-weight: 800; }
  .net-row {
    display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 14px 16px; border-radius: 16px;
    background: linear-gradient(90deg, rgba(229,35,46,.16), rgba(229,35,46,.04)); border: 1px solid rgba(229,35,46,.25);
  }
  .net-row b { font-size: 13px; font-weight: 800; letter-spacing: .8px; }
  .net-row span { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
  .fine { font-size: 11.5px; color: var(--faint); margin-top: 12px; line-height: 1.5; }
  .warn { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; font-weight: 600; margin-top: 10px; }

  /* ---------- Sejarah gaji ---------- */
  .hist { margin-top: 6px; }
  .h-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--stroke); }
  .h-row:last-child { border-bottom: 0; }
  .h-row:active { opacity: .7; }
  .h-row .ico { width: 42px; height: 42px; }
  .h-mid { flex: 1; min-width: 0; }
  .h-mid b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-mid span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .h-amt { text-align: right; flex: none; }
  .h-amt b { display: block; font-weight: 800; font-size: 15.5px; }
  .tag { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .9px; padding: 3px 7px; border-radius: 6px; margin-top: 4px; }
  .tag.cur { background: var(--green-soft); color: var(--green); }
  .tag.view { background: var(--ov-2); color: var(--text-2); }
  .tag.mid { background: var(--violet-soft); color: var(--violet); }
  .tag.live { background: var(--green-soft); color: var(--green); }
  .tag.err { background: var(--red-soft); color: var(--minus); }
  .tag.off { background: var(--ov); color: var(--faint); }
  .tag.settled { background: var(--green-soft); color: var(--green); display: inline-flex; align-items: center; gap: 3px; }
  .tag.settled .i { width: 11px; height: 11px; stroke-width: 3; }
  .r.settled { box-shadow: inset 3px 0 0 var(--green); }
  .tag.absent { background: var(--red-soft); color: var(--minus); display: inline-flex; align-items: center; gap: 3px; }
  .tag.absent .i { width: 11px; height: 11px; stroke-width: 3; }
  .tag.adj { background: var(--amber-soft); color: var(--amber); }
  .tag.adj.less { background: var(--ov-2); color: var(--muted); }
  .r.absent { box-shadow: inset 3px 0 0 var(--minus); }
  .r-date.nodate { border-color: var(--amber); border-style: dashed; }
  .r-date.nodate b { color: var(--amber); }
  .r-date.nodate span { font-size: 7.5px; letter-spacing: .2px; }
  .r.undated { box-shadow: inset 3px 0 0 var(--amber); }
  .r.early, .r.ot { box-shadow: inset 3px 0 0 var(--amber); }
  .tag.ot { background: var(--amber-soft); color: var(--amber); }
  .ot-inline { color: var(--amber); font-weight: 700; }
  .hero .ot-inline { color: #FFC266; }
  .hero-ot { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: #FFC266; background: rgba(255,176,32,.16); border: 1px solid rgba(255,176,32,.35); }
  .hero-ot svg.i { width: 14px; height: 14px; }
  .hero-ot b { color: #FFD68A; }
  .li.ot-li > span, .li.ot-li div b { color: var(--amber); }
  .r-msg.ot-msg { margin-top: -4px; }
  .ot-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding: 12px 16px; border-radius: 16px;
    background: var(--amber-soft); border: 1px dashed rgba(255,176,32,.6); color: var(--amber); }
  .ot-box b { display: block; font-size: 13px; font-weight: 800; letter-spacing: .4px; }
  .ot-box span { display: block; font-size: 11.5px; opacity: .85; margin-top: 2px; }
  .ot-box strong { font-size: 15px; font-weight: 800; text-align: right; white-space: nowrap; }
  .r-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .r-right .tag { margin: 0; }
  .r.settled .r-mid span, .r.absent .r-mid span { white-space: normal; }

  /* ---------- Jadual ---------- */
  .list-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 4px 2px 14px; }
  .list-head h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.4px; }
  .list-head span { color: var(--muted); font-size: 13px; }
  .btn-add { height: 40px; padding: 0 16px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13.5px; color: #fff;
    background: linear-gradient(180deg, var(--red-hi), var(--red)); box-shadow: 0 8px 20px rgba(229,35,46,.35); }
  .btn-add svg.i { width: 17px; height: 17px; stroke-width: 2.6; }
  .sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .sum3 div { background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--shadow-tile); border-radius: 16px; padding: 12px; }
  .sum3 b { display: block; font-size: 19px; font-weight: 800; }
  .sum3 span { font-size: 11.5px; color: var(--muted); }
  .rows { background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--shadow-tile); border-radius: var(--r-l); overflow: hidden; }
  .r { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--stroke); width: 100%; text-align: left; }
  .r:last-child { border-bottom: 0; }
  .r:active { background: var(--ov); }
  .r-date { width: 46px; height: 50px; flex: none; border-radius: 13px; background: var(--tile); border: 1px solid var(--stroke); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
  .r-date b { font-size: 18px; font-weight: 800; }
  .r-date span { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .r.today .r-date { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .r-mid { flex: 1; min-width: 0; }
  .r-mid b { display: block; font-weight: 700; font-size: 14.5px; }
  .r-mid span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-right { text-align: right; flex: none; }
  .r-right b { display: block; font-size: 16px; font-weight: 800; }
  .r-rm { display: block; font-size: 12.5px; font-weight: 800; color: var(--green); margin-top: 1px; }
  .lock-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); background: var(--ov); border-radius: 12px; padding: 9px 12px; margin: -4px 0 14px; }
  .lock-note svg.i { width: 16px; height: 16px; flex: none; }
  .r.past .r-mid b, .r.past .r-right b, .r.past .r-date b { color: var(--muted); }
  .r.past .r-date { opacity: .7; }
  .r.warnrow .r-date { border-color: var(--amber); }
  .r.off .r-mid b, .r.off .r-right b, .r.off .r-date b { color: var(--faint); }
  .empty { text-align: center; color: var(--muted); padding: 40px 24px; font-size: 14px; line-height: 1.6; }
  .empty svg.i { width: 40px; height: 40px; color: var(--faint); margin-bottom: 8px; stroke-width: 1.5; }

  /* ---------- Tetapan ---------- */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--stroke); }
  .set-row:last-child { border-bottom: 0; padding-bottom: 2px; }
  .set-row label { flex: 1; font-weight: 600; font-size: 14.5px; }
  .set-row label small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 1px; }
  .num { width: 104px; height: 44px; border: 1px solid var(--stroke-2); border-radius: 12px; padding: 0 12px; font: inherit; font-weight: 800; text-align: right; background: var(--field); color: var(--text); }
  .num:focus, .fld input:focus, .txt:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  .switch, .set-row label.switch { position: relative; width: 50px; height: 30px; flex: 0 0 50px; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--ov-3); transition: background .2s; }
  .switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .2s var(--ease); }
  .switch input:checked + i { background: var(--red); box-shadow: 0 0 14px rgba(229,35,46,.45); }
  .switch input:checked + i::after { transform: translateX(20px); }
  .stack { display: grid; gap: 10px; }
  .about { font-size: 12px; color: var(--faint); text-align: center; margin: 18px 10px 0; line-height: 1.6; }
  .sec-t { margin-bottom: 6px; }

  /* ---------- Nav bawah ---------- */
  nav {
    position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
    display: flex; padding: 6px; border-radius: 22px;
    background: var(--nav-bg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--stroke-2); box-shadow: var(--shadow-nav);
  }
  nav button { flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 11px; font-weight: 700; border-radius: 16px; transition: background .2s, color .2s; }
  nav button svg.i { width: 22px; height: 22px; }
  nav button.on { color: var(--nav-on); background: linear-gradient(180deg, rgba(229,35,46,.28), rgba(229,35,46,.12)); box-shadow: inset 0 0 0 1px rgba(229,35,46,.35); }
  nav button.on svg.i { color: var(--red-hi); }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 90%; overflow-y: auto; z-index: 21;
    background: var(--sheet); border-top: 1px solid var(--stroke-2); border-radius: 26px 26px 0 0;
    transform: translateY(105%); transition: transform .3s var(--ease); padding: 8px 18px calc(20px + env(safe-area-inset-bottom)); }
  .sheet.on { transform: none; }
  .grab { width: 42px; height: 5px; border-radius: 5px; background: var(--ov-3); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 16px; font-size: 20px; font-weight: 800; letter-spacing: -.2px; }
  .sheet p { margin: -6px 0 18px; color: var(--text-2); font-size: 14px; line-height: 1.5; }
  .fld { display: block; margin-bottom: 12px; }
  .fld span, .fld-label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .fld input, .txt { width: 100%; height: 50px; border: 1px solid var(--stroke-2); border-radius: 14px; padding: 0 14px; font: inherit; font-size: 16px; font-weight: 600; background: var(--field); color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; background: var(--field); border: 1px solid var(--stroke); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; height: 40px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); transition: all .2s; }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.4), inset 0 0 0 1px rgba(229,35,46,.5); }
  .check { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; font-weight: 600; font-size: 14px; }
  .check input { width: 20px; height: 20px; accent-color: var(--red); }
  .preview { display: flex; align-items: center; gap: 10px; background: var(--field); border: 1px solid var(--stroke); border-radius: 14px; padding: 13px 14px; font-weight: 800; margin: 2px 0 16px; }
  .preview small { font-weight: 600; color: var(--muted); }
  .preview.err { background: var(--red-soft); border-color: rgba(229,35,46,.3); color: var(--minus); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border: 1px solid var(--stroke-2); border-radius: 16px; margin-bottom: 10px; background: var(--field); }
  .opt.on { border-color: rgba(229,35,46,.6); background: linear-gradient(90deg, rgba(229,35,46,.14), rgba(229,35,46,.03)); }
  .opt div { flex: 1; min-width: 0; }
  .opt b { display: block; font-weight: 700; }
  .opt span { font-size: 12.5px; color: var(--muted); }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ov-3); flex: none; }
  .opt.on .radio { border: 7px solid var(--red); }

  /* ---------- Imbas jadual ---------- */
  .head-btns { display: flex; gap: 8px; }
  .btn-scan { height: 40px; padding: 0 14px 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13.5px;
    color: var(--red); background: var(--red-soft); box-shadow: inset 0 0 0 1px rgba(229,35,46,.28); }
  .btn-scan svg.i { width: 17px; height: 17px; }
  .prog { height: 8px; border-radius: 99px; background: var(--ov-2); overflow: hidden; margin: 6px 0 10px; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red-hi), var(--red)); transition: width .3s; }
  .r-stat { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .r-crop { display: block; max-width: 100%; height: auto; margin: 0 auto 12px; border-radius: 10px; border: 1px solid var(--stroke-2); background: #fff; }
  .r-msg { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .r-msg.ok { background: var(--green-soft); color: var(--green); }
  .r-msg.warn { background: var(--amber-soft); color: var(--amber); }
  .strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-bottom: 6px; }
  .hr { height: 46px; border-radius: 9px; background: var(--field); border: 1px solid var(--stroke-2); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
  .hr em { font-style: normal; font-size: 9.5px; font-weight: 700; color: var(--muted); }
  .hr b { font-size: 14px; font-weight: 900; line-height: 1.1; color: transparent; }
  .hr.x { background: var(--red); border-color: var(--red); }
  .hr.x em, .hr.x b { color: #fff; }
  .hr.b { background: var(--amber); border-color: var(--amber); }
  .hr.b em, .hr.b b { color: #2A1A00; }
  .pick { display: grid; gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
  .pk { display: block; width: 100%; padding: 8px; border-radius: 12px; background: #fff; border: 1px solid var(--stroke-2); box-shadow: var(--shadow-tile); }
  .pk:active { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .pk img { display: block; width: 100%; height: auto; }
  .strip-lbl { font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: .6px; margin: 8px 0 4px; }

  /* ---------- Syif selesai ---------- */
  .done { text-align: center; padding: 6px 0 8px; }
  .done-ic { width: 68px; height: 68px; margin: 4px auto 12px; border-radius: 50%; display: grid; place-items: center; color: var(--green);
    background: var(--green-soft); box-shadow: 0 0 0 8px rgba(46,212,122,.07); animation: pop .5s var(--ease) both; }
  .done-ic svg.i { width: 34px; height: 34px; stroke-width: 2.6; }
  .done h3 { margin-bottom: 14px; }
  .done-amt { font-size: 46px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-top: 6px; }
  .done-amt .cur { font-size: 18px; font-weight: 700; color: var(--muted); margin-right: 6px; letter-spacing: 0; }
  .done-amt .dec { font-size: 24px; color: var(--text-2); }
  .done-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Skrin pilih bahasa ---------- */
  .gate { color: var(--text);
    position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-end; justify-content: center; padding: 28px 22px calc(34px + env(safe-area-inset-bottom));
    background:
      var(--gate-art, none) center top / cover no-repeat,
      radial-gradient(120% 70% at 80% 0%, var(--gate-glow-1), transparent 60%),
      radial-gradient(90% 60% at 0% 30%, var(--gate-glow-2), transparent 60%),
      var(--bg); }
  .gate.on { display: flex; }
  .gate-in { width: 100%; max-width: 380px; animation: rise .6s var(--ease) both; }
  .gate .mark { width: 64px; height: 64px; border-radius: 20px; font-size: 24px; margin-bottom: 20px; }
  .gate-brand { font-size: 34px; font-weight: 900; letter-spacing: -.6px; line-height: 1.05; }
  .gate-tag { color: var(--text-2); font-size: 14px; margin: 8px 0 34px; }
  .gate-q { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .gate-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; margin-bottom: 10px; text-align: left; border-radius: 18px;
    background: var(--card); border: 1px solid var(--stroke-2); box-shadow: var(--shadow-tile); transition: transform .12s; }
  .gate-btn:active { transform: scale(.98); background: var(--red-soft); }
  .gate-btn .code { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #fff; background: linear-gradient(145deg, var(--red-hi), var(--red-lo)); }
  .gate-btn div { flex: 1; }
  .gate-btn b { display: block; font-size: 16px; font-weight: 800; }
  .gate-btn span { font-size: 12.5px; color: var(--muted); }
  .gate-note { font-size: 12px; color: var(--faint); margin-top: 14px; text-align: center; line-height: 1.6; }
  /* Skrin pasang (iPhone Safari): langkah Add to Home Screen */
  .inst-step { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--stroke-2); box-shadow: var(--shadow-tile); }
  .inst-step .num { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #fff;
    background: linear-gradient(145deg, var(--red-hi), var(--red-lo)); }
  .inst-step div { flex: 1; font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .inst-step div span { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .inst-step svg.i { flex: none; width: 24px; height: 24px; color: var(--text-2); }
  .inst-skip { display: block; width: 100%; padding: 12px; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30;
    background: rgba(32,35,43,.96); border: 1px solid var(--stroke-2); color: #fff; border-radius: 16px; padding: 13px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); transform: translateY(16px); opacity: 0; pointer-events: none; transition: all .25s var(--ease); }
  .toast.on { transform: none; opacity: 1; pointer-events: auto; }
  .toast span { flex: 1; font-size: 14px; font-weight: 600; }
  .toast button { color: var(--red-hi); font-weight: 800; font-size: 13px; letter-spacing: .8px; padding: 4px 6px; }

  :root[data-theme="light"] .seg button.on { box-shadow: 0 1px 4px rgba(16,18,24,.12), inset 0 0 0 1px rgba(229,35,46,.45); }
  :root[data-theme="light"] nav button.on { background: var(--red-soft); box-shadow: inset 0 0 0 1px rgba(229,35,46,.22); }
  :root[data-theme="light"] nav button.on svg.i { color: var(--red); }
  :root[data-theme="light"] .hero { box-shadow: 0 18px 40px rgba(200,20,30,.28), inset 0 1px 0 rgba(255,255,255,.12); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gWork" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6A4D"/><stop offset="1" stop-color="#E5232E"/></linearGradient>
      <linearGradient id="gBrk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
    </defs>
  </svg>

  <header class="appbar">
    <div class="mark">TJ</div>
    <div class="brand"><b>Texas Jerantut</b><small id="brandSub"></small></div>
    <button class="chip" id="periodChip">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span id="periodName"></span>
      <svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-list"></section>
    <section class="view" id="v-set"></section>
  </main>

  <nav>
    <button data-tab="home" class="on">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span id="navHome"></span>
    </button>
    <button data-tab="plan">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M7.5 17h6"/></svg>
      <span id="navPlan"></span>
    </button>
    <button data-tab="list">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 12.2 2.8 2.8L16.5 9"/></svg>
      <span id="navList"></span>
    </button>
    <button data-tab="set">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span id="navSet"></span>
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="gate" id="langGate"></div>
  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

  <input type="file" id="rosterFile" accept="image/*" multiple hidden>
  <script src="ocr/tesseract.min.js"></script>
  <script src="i18n.js"></script>
  <script src="calc.js"></script>
  <script src="seed.js"></script>
  <script src="roster.js"></script>
  <script src="app.js"></script>
  <script>
    // Web app (iPhone/browser): simpan fail dalam cache supaya jalan offline. sw.js hanya ada dalam versi web (tools/build-pwa.js);
    // dalam APK Android (AndroidUI) tak perlu.
    if ('serviceWorker' in navigator && !window.AndroidUI && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      // Minta browser jangan padam data app
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    }
  </script>
</body>
</html>
